<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Rohan and Callum's Hotel</title><style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#382015;--orange:#f47721;--gold:#ffc65b;--cream:#fff8ec;--deep:#9d351b}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f47721;color:var(--ink);overflow:hidden}
body{background:radial-gradient(ellipse at 15% 15%,rgba(255,224,139,.95) 0,rgba(255,224,139,0) 35%),radial-gradient(ellipse at 88% 85%,rgba(157,53,27,.62) 0,rgba(157,53,27,0) 38%),linear-gradient(135deg,#ffb347 0%,#ff842e 48%,#e95420 100%)}
.screen{height:100%;width:100%;display:grid;place-items:center;padding:5vw;position:relative;isolation:isolate}
.screen:before,.screen:after{content:"";position:absolute;z-index:-1;border:1px solid rgba(255,255,255,.32);border-radius:50%;pointer-events:none}
.screen:before{width:min(75vw,850px);aspect-ratio:1;right:-24%;top:-50%;box-shadow:0 0 0 35px rgba(255,255,255,.055),0 0 0 75px rgba(255,255,255,.045)}
.screen:after{width:min(45vw,500px);aspect-ratio:1;left:-18%;bottom:-38%;box-shadow:0 0 0 25px rgba(255,255,255,.07),0 0 0 55px rgba(255,255,255,.045)}
.outline{width:min(92vw,1150px);min-height:min(75vh,650px);border:1px solid rgba(255,255,255,.82);border-radius:24% 20% 22% 18% / 15% 20% 18% 17%;padding:clamp(25px,7vw,90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,rgba(255,250,239,.96),rgba(255,237,204,.91));box-shadow:0 28px 75px rgba(100,35,8,.22),inset 0 1px 0 #fff;position:relative;overflow:hidden}
.outline:before{content:"";position:absolute;inset:12px;border:1px solid rgba(244,119,33,.22);border-radius:inherit;pointer-events:none}
.eyebrow{font-size:clamp(12px,2vw,20px);letter-spacing:.3em;text-transform:uppercase;margin-bottom:24px;color:#a7481d;font-weight:800}
h1{font-size:clamp(42px,9vw,112px);line-height:1.05;letter-spacing:-.055em;margin:0;overflow-wrap:anywhere;color:#542516;text-shadow:0 2px 0 rgba(255,255,255,.8)}
.subtitle{font-size:clamp(17px,3vw,30px);line-height:1.5;margin:26px 0 0;color:#75452e}
.form{width:min(100%,560px);text-align:left;margin-top:26px}.form label{display:block;font-weight:700;margin:15px 0 7px;color:#71331b}
.form input{width:100%;padding:15px;border:1.5px solid #e3b28c;border-radius:12px;font-size:19px;background:#fffdf8;color:#382015;outline:none;box-shadow:0 2px 7px rgba(100,35,8,.05);transition:border-color .2s,box-shadow .2s}
.form input:focus{border-color:#ed7022;box-shadow:0 0 0 4px rgba(244,119,33,.18)}
.form button{margin-top:20px;width:100%;padding:16px;border:0;border-radius:12px;background:linear-gradient(110deg,#a83d1c,#ef6a21 65%,#ff9c32);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(164,57,22,.24);transition:transform .18s,box-shadow .18s}
.form button:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(164,57,22,.3)}.form button:active{transform:translateY(0)}
.status{min-height:24px;margin-top:15px;font-weight:700;color:#8d3419}.hidden{display:none!important}
@media(max-width:550px){.screen{padding:5vw}.outline{border-radius:22% 18% 20% 16% / 12% 15% 14% 12%;min-height:72vh;padding:clamp(22px,6vw,36px)}.eyebrow{letter-spacing:.18em}.form input{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head><body><main id="app" class="screen"><section class="outline"><div class="eyebrow" id="eyebrow">A warm welcome</div><h1 id="title">Welcome to<br>Rohan and Callum's Hotel</h1><p id="subtitle" class="subtitle"></p><form id="booking" class="form hidden"><label for="guest">Guest name</label><input id="guest" name="guest" autocomplete="name" required maxlength="80"><label for="plate">Car registration</label><input id="plate" name="plate" autocomplete="off" autocapitalize="characters" maxlength="12" required><button type="submit">Register car</button><div id="status" class="status" role="status"></div></form></section></main><script>
const title=document.getElementById('title'),eyebrow=document.getElementById('eyebrow'),subtitle=document.getElementById('subtitle'),booking=document.getElementById('booking'),statusEl=document.getElementById('status');let current={};
function show(s){current=s;const screen=s.screen||'welcome';booking.classList.toggle('hidden',screen!=='registration');if(screen==='welcome'){eyebrow.textContent='';title.textContent='';title.innerHTML='Welcome to<br>Rohan and Callum's Hotel';subtitle.textContent='';}else if(screen==='registration'){eyebrow.textContent='Guest arrival';title.textContent='Car registration';subtitle.textContent=s.message||'Please enter your name and car registration.';}else{eyebrow.textContent='Rohan and Callum's Hotel';title.textContent='Enjoy your stay';subtitle.textContent=(s.guest?'Welcome, '+s.guest+'. ':'')+(s.room?'Your room is '+s.room+'. ':'')+(s.message||'We hope you have a wonderful stay.');}}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)show(await r.json())}catch(e){}}
booking.addEventListener('submit',async e=>{e.preventDefault();statusEl.textContent='Registering…';try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guest:document.getElementById('guest').value.trim(),plate:document.getElementById('plate').value.trim().toUpperCase()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not register');statusEl.textContent='Registration received.';show(d.state)}catch(err){statusEl.textContent=err.message}});
poll();setInterval(poll,1500);
</script></body></html>
