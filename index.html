<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Rohans Hotel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#080808;overflow:hidden}.screen{height:100%;width:100%;display:grid;place-items:center;padding:5vw}.outline{width:min(92vw,1150px);min-height:min(75vh,650px);border:2px solid #111;border-radius:24% 20% 22% 18% / 15% 20% 18% 17%;padding:clamp(25px,7vw,90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.eyebrow{font-size:clamp(12px,2vw,20px);letter-spacing:.3em;text-transform:uppercase;margin-bottom:24px}h1{font-size:clamp(42px,9vw,112px);line-height:1.05;letter-spacing:-.055em;margin:0;overflow-wrap:anywhere}.subtitle{font-size:clamp(17px,3vw,30px);line-height:1.5;margin:26px 0 0}.form{width:min(100%,560px);text-align:left;margin-top:26px}.form label{display:block;font-weight:700;margin:15px 0 7px}.form input{width:100%;padding:15px;border:1.5px solid #111;border-radius:10px;font-size:19px}.form button{margin-top:20px;width:100%;padding:16px;border:1.5px solid #111;border-radius:10px;background:#111;color:white;font-size:18px;font-weight:700;cursor:pointer}.status{min-height:24px;margin-top:15px;font-weight:700}.hidden{display:none!important}@media(max-width:550px){.outline{border-radius:22% 18% 20% 16% / 12% 15% 14% 12%;min-height:72vh}.eyebrow{letter-spacing:.18em}.form input{font-size:16px}}
</style></head><body><main id="app" class="screen"><section class="outline"><div class="eyebrow" id="eyebrow">A warm welcome</div><h1 id="title">Welcome to<br>Rohans Hotel</h1><p id="subtitle" class="subtitle"></p><form id="booking" class="form hidden"><label for="guest">Guest name</label><input id="guest" name="guest" autocomplete="name" required maxlength="80"><label for="plate">Car registration</label><input id="plate" name="plate" autocomplete="off" autocapitalize="characters" maxlength="12" required><button type="submit">Register car</button><div id="status" class="status" role="status"></div></form></section></main><script>
const title=document.getElementById('title'),eyebrow=document.getElementById('eyebrow'),subtitle=document.getElementById('subtitle'),booking=document.getElementById('booking'),statusEl=document.getElementById('status');let current={};
function show(s){current=s;const screen=s.screen||'welcome';booking.classList.toggle('hidden',screen!=='registration');if(screen==='welcome'){eyebrow.textContent='';title.textContent='';title.innerHTML='Welcome to<br>Rohans Hotel';subtitle.textContent='';}else if(screen==='registration'){eyebrow.textContent='Guest arrival';title.textContent='Car registration';subtitle.textContent=s.message||'Please enter your name and car registration.';}else{eyebrow.textContent='Rohans Hotel';title.textContent='Enjoy your stay';subtitle.textContent=(s.guest?'Welcome, '+s.guest+'. ':'')+(s.room?'Your room is '+s.room+'. ':'')+(s.message||'We hope you have a wonderful stay.');}}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)show(await r.json())}catch(e){}}
booking.addEventListener('submit',async e=>{e.preventDefault();statusEl.textContent='Registering…';try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guest:document.getElementById('guest').value.trim(),plate:document.getElementById('plate').value.trim().toUpperCase()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not register');statusEl.textContent='Registration received.';show(d.state)}catch(err){statusEl.textContent=err.message}});
poll();setInterval(poll,1500);
</script></body></html>
