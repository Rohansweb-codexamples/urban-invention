<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohans Hotel Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#111;font-family:Arial,sans-serif;padding:22px}.wrap{max-width:850px;margin:auto}h1{font-size:clamp(34px,7vw,58px);margin:8px 0 12px;letter-spacing:-.05em}.muted{color:#555;line-height:1.5}.card{background:white;border:1px solid #ddd;border-radius:18px;padding:22px;margin:18px 0}button{border:1.5px solid #111;border-radius:10px;padding:15px;background:white;font-weight:800;font-size:16px;cursor:pointer;width:100%;text-align:left;margin:7px 0}button.active,button.primary{background:#111;color:white}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea{width:100%;padding:14px;border:1px solid #999;border-radius:9px;font:inherit}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.notice{padding:12px;border-radius:9px;background:#e8f7e9;margin-top:12px;min-height:42px}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p class="muted">ROHANS WEB · HOTEL DISPLAY CONTROL</p><h1>Rohans Hotel Admin</h1><p class="muted">Control the screen shown on your tablet. Changes are sent through the Render server, so the display updates automatically.</p><section class="card"><h2>Choose the display screen</h2><div class="grid"><button data-screen="welcome">1 · Welcome screen</button><button data-screen="registration">2 · Car registration</button><button data-screen="enjoy">3 · Enjoy your stay</button></div></section><section class="card"><h2>Guest welcome screen</h2><label for="guest">Guest name</label><input id="guest" placeholder="Type guest name"><label for="room">Hotel room</label><input id="room" placeholder="e.g. 12" maxlength="20"><label for="message">Enjoy-your-stay message</label><textarea id="message">We hope you have a wonderful stay.</textarea><button id="apply" class="primary">Show guest welcome screen</button><button id="clear">Clear guest details</button><div id="notice" class="notice" role="status">Connecting to server…</div></section><section class="card"><h2>Current booking</h2><p id="current">Loading…</p><button id="refresh">Refresh status</button></section></main><script>
let state={};const notice=document.getElementById('notice');async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Server request failed');return d}
function paint(s){state=s;document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===(s.screen||'welcome')));document.getElementById('guest').value=s.guest||'';document.getElementById('room').value=s.room||'';document.getElementById('message').value=s.message||'We hope you have a wonderful stay.';document.getElementById('current').textContent='Screen: '+(s.screen||'welcome')+' · Guest: '+(s.guest||'—')+' · Room: '+(s.room||'—')+' · Car: '+(s.plate||'—')}
async function refresh(){try{paint(await api('/api/state'));notice.textContent='Connected to Render server.'}catch(e){notice.textContent='Connection error: '+e.message}}
async function update(data){try{const d=await api('/api/admin',{...data});paint(d.state);notice.textContent='Display updated successfully.'}catch(e){notice.textContent='Could not update display: '+e.message}}
document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>update({screen:b.dataset.screen})));
document.getElementById('apply').addEventListener('click',()=>update({screen:'enjoy',guest:document.getElementById('guest').value.trim(),room:document.getElementById('room').value.trim(),message:document.getElementById('message').value.trim()}));
document.getElementById('clear').addEventListener('click',()=>update({guest:'',room:'',plate:'',screen:'welcome',message:'We hope you have a wonderful stay.'}));
document.getElementById('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,5000);
</script></body></html>
